[Unit]
After=systemd-tmpfiles-setup.service
OnFailure=minimal-host-failure@%n.service

[Service]
ExecStart=
ExecStart=/usr/bin/flock -n /run/minimal-host/lifecycle.lock /usr/bin/dnf5 automatic --timer
ExecStartPost=/usr/bin/touch /var/lib/minimal-host/os-update-success
TimeoutStartSec=infinity
UMask=0077
